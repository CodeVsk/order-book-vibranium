# build/nginx/nginx.conf
#
# Reverse proxy / load balancer in front of the cmd/api replicas
# (2 by default, see `deploy.replicas` on the `api` service — scale
# further with `docker compose up --scale api=N`). Docker Compose's
# embedded DNS (127.0.0.11) resolves the `api` hostname to one address
# per container, so proxy_pass re-resolves it per request (instead of
# caching a single upstream IP) to round-robin across all of them.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Don't leak the nginx version to clients.
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Matches the largest documented request payload with headroom; keeps
    # this proxy from being usable as an unbounded upload relay.
    client_max_body_size 1m;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     'rid=$http_x_request_id rt=$request_time '
                     'upstream=$upstream_addr';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Preserve the caller's X-Request-Id if present; otherwise fall back to
    # nginx's own generated request identifier ($request_id).
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        # Only forward known API paths; anything else gets a plain 404
        # instead of being proxied blindly to the backend.
        location ~ ^/(orders|wallets|trades|users)(/|$) {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Propagate the correlation ID the API's CorrelationID
            # middleware reads; generate one if the caller didn't send it.
            proxy_set_header X-Request-Id $req_id;

            # Exposes which api replica served the request — handy to
            # demonstrate the load balancing (e.g. `curl -i` in a loop).
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location / {
            return 404;
        }
    }
}
